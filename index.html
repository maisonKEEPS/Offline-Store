<title>Part-time Shift Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Source+Code+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0A0A0A; --muted:#5E5E5E; --line:#E2E2E2;
  --accent:#0020C2; --accent-soft:#E6E9FA; --accent-ink:#FFFFFF;
  --taken:#BDBDBD; --chip:#F1F1F1; --open:#FFFFFF; --past:#F6F6F6;
  --radius-s:6px; --radius-m:10px;
  --font:"Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0E0E0E; --ink:#FFFFFF; --muted:#A3A3A3; --line:#2A2A2A;
    --accent:#4A63F0; --accent-soft:#0A1033; --accent-ink:#FFFFFF;
    --taken:#4A4A4A; --chip:#1E1E1E; --open:#0E0E0E; --past:#070707;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0E0E; --ink:#FFFFFF; --muted:#A3A3A3; --line:#2A2A2A;
  --accent:#4A63F0; --accent-soft:#0A1033; --accent-ink:#FFFFFF;
  --taken:#4A4A4A; --chip:#1E1E1E; --open:#0E0E0E; --past:#070707;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer;text-transform:inherit}
select,option{text-transform:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:.45rem .6rem;width:100%}

.wrap{max-width:1180px;margin:0 auto;padding:1.25rem 1.25rem 3rem}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap}
h1{font-size:clamp(1.4rem,3.2vw,2.1rem);line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--muted);margin:.3rem 0 0;font-size:.9rem}
.who{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:.45rem .9rem;font-size:.88rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--accent);border-color:transparent;background:transparent;padding:.3rem .5rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.rail{margin:1.6rem -1.25rem 0;padding:0 1.25rem;overflow-x:auto;scrollbar-width:thin}
.rail-inner{position:relative;display:flex;gap:.7rem;padding:0 .25rem 1rem;min-width:max-content}
.rail-inner::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;border-radius:3px;background:var(--ink);opacity:.85}
.tag{position:relative;margin-top:9px;padding:1.15rem .9rem .55rem;min-width:150px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px 4px var(--radius-m) var(--radius-m);transition:transform .18s ease}
.tag::before{content:"";position:absolute;top:-9px;left:50%;width:2px;height:12px;background:var(--ink);transform:translateX(-50%)}
.tag::after{content:"";position:absolute;top:.45rem;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg)}
.tag b{display:block;font-weight:600;font-size:.92rem;line-height:1.3;white-space:nowrap}
.tag small{display:block;color:var(--muted);font-size:.72rem;white-space:nowrap}
.tag:hover{transform:translateY(2px)}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(6px)}
.tag[aria-pressed="true"] small{color:inherit;opacity:.85}
.tag[aria-pressed="true"]::after{border-color:var(--accent-ink);background:var(--accent)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:1.5rem;margin-top:.75rem;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}
.monthbar h2{font-size:1.3rem;margin:0;font-weight:700}
.monthbar .nav{display:flex;gap:.35rem}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.05rem;line-height:1}
.iconbtn:hover{border-color:var(--ink)}
.legend{display:flex;gap:1rem;flex-wrap:wrap;color:var(--muted);font-size:.78rem;margin:.5rem 0 0}
.legend span{display:inline-flex;align-items:center;gap:.35rem}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:.5rem .6rem;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--line);font-weight:500}
.day{position:relative;min-height:110px;padding:.45rem .45rem .5rem;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:.25rem;border-radius:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--bg);cursor:default}
.day.past{background:var(--past)}
.day.past .num{color:var(--muted)}
.day:not(.out):hover{box-shadow:inset 0 0 0 2px var(--ink)}
.day .top{display:flex;justify-content:space-between;align-items:center;gap:.2rem}
.day .num{font-weight:600;font-size:.9rem;line-height:1}
.day.today .num{display:inline-grid;place-items:center;width:26px;height:26px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--ink);color:var(--bg)}
.day .cnt{font-size:.68rem;color:var(--muted)}
.day .cnt.full{color:var(--accent);font-weight:600}
.names{display:flex;flex-direction:column;gap:2px}
.nm{font-size:.7rem;font-weight:500;background:var(--chip);border-radius:3px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.me{background:var(--accent);color:var(--accent-ink)}
.nm.free{background:transparent;border:1px dashed var(--taken);color:var(--muted)}
.seats{display:none;gap:3px;flex-wrap:wrap}
.seat{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--taken);background:var(--open);display:inline-block}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--veil:rgba(14,14,16,.84);--veil-login:rgba(14,14,16,.45)}}
:root[data-theme="dark"]{--veil:rgba(14,14,16,.84);--veil-login:rgba(14,14,16,.45)}
body{background:linear-gradient(var(--veil),var(--veil)),var(--store) center/cover no-repeat fixed;background-color:var(--bg)}
.login{background:linear-gradient(var(--veil-login),var(--veil-login)),var(--store) center/cover no-repeat}
.login::before,.login::after{display:none}
@media (max-width:640px){body{background-attachment:scroll}}

/* left menu */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.app.hidden{display:none !important}
.app>.wrap{width:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;padding:30px 16px;display:flex;flex-direction:column;gap:6px;
  background:rgba(255,255,255,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid rgba(255,255,255,.7);box-shadow:8px 0 30px rgba(20,20,22,.06)}
.side-title{font-size:.68rem;letter-spacing:.24em;color:var(--muted);font-weight:600;padding:0 12px 10px}
.side .nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;border-radius:12px;padding:13px 14px;text-align:left;color:var(--ink);text-transform:none}
.side .nav span{font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif;font-weight:600;font-size:1.02rem}
.side .nav svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side .nav:hover{background:rgba(0,0,0,.05)}
.side .nav[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px rgba(20,20,22,.18)}
.emptysched{background:var(--surface);border-radius:var(--radius-m);padding:2.4rem 1.6rem;text-align:center;box-shadow:0 10px 26px rgba(20,20,22,.08);display:flex;flex-direction:column;gap:.5rem}
.emptysched b{font-family:"IBM Plex Sans Thai",sans-serif;font-size:1.15rem}
.emptysched span{font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif;color:var(--muted);font-size:.9rem;text-transform:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side{background:rgba(22,22,25,.72);border-right-color:rgba(255,255,255,.06)}}
:root[data-theme="dark"] .side{background:rgba(22,22,25,.72);border-right-color:rgba(255,255,255,.06)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:15;flex-direction:row;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
    border-right:0;border-top:1px solid rgba(255,255,255,.7);box-shadow:0 -8px 24px rgba(20,20,22,.10)}
  .side-title{display:none}
  .side .nav{flex:1 1 0;min-width:0;flex-direction:column;justify-content:center;align-items:center;padding:7px 2px 6px;gap:3px;border-radius:12px;position:relative}
  .side .nav span{font-size:.64rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .side .nav svg{width:21px;height:21px}
  .side .nav .ext{display:none}
  .side .nav .badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0;font-size:.58rem;padding:0 5px}
  .app>.wrap{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
}

.pubbar .ret{color:var(--need,#D7141A)}
.pubbar .retnote{width:auto;flex:1 1 180px;max-width:260px;padding:.35rem .6rem;font-size:.78rem;text-transform:none}
.pubbar b{font-weight:700;color:var(--ink)}

.side .nav .badge{margin-left:auto;font-style:normal;font-size:.72rem;font-weight:700;background:var(--need,#D7141A);color:#fff;border-radius:999px;padding:1px 8px}
.side .nav.hidden,.badge.hidden{display:none !important}
.apcard{background:var(--surface);border-radius:var(--radius-m);box-shadow:0 10px 26px rgba(20,20,22,.08);padding:1rem 1.1rem;margin-bottom:.9rem}
.apcard.pending{box-shadow:0 0 0 2px var(--accent),0 10px 26px rgba(20,20,22,.08)}
.aphead{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.aphead b{font-size:.95rem}
.apnote{margin:.35rem 0 0;color:var(--muted);font-size:.78rem}
.apst{display:inline-block;margin-left:.6rem;font-size:.66rem;font-weight:700;padding:.15rem .5rem;border-radius:4px;vertical-align:2px}
.apst.p{background:var(--accent);color:var(--accent-ink)}.apst.r{background:var(--need,#D7141A);color:#fff}.apst.a{background:#93C47D;color:#000}
.apbtns{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.apbtns .btn{padding:.4rem .8rem;font-size:.78rem}
.apbtns .retnote{width:auto;flex:1 1 160px;max-width:220px;padding:.38rem .6rem;font-size:.78rem;text-transform:none}
.apprev{margin-top:.9rem}

/* Lark-style Flagship table */
.fwrap{overflow-x:auto;background:#fff;border-radius:var(--radius-m);box-shadow:0 10px 26px rgba(20,20,22,.08)}
.ft{border-collapse:collapse;font-size:.66rem;color:#000;text-transform:none;white-space:nowrap;table-layout:fixed}
.ft th,.ft td{border:1px solid #c9c9cc;padding:.28rem .2rem;text-align:center;overflow:hidden;text-overflow:ellipsis}
.ft .f-tot td.s2{white-space:normal;line-height:1.15}
.ft thead th{background:#000;color:#fff;font-weight:700}
.ft .f-title th{text-align:left;font-size:.75rem}
.ft .f-ev th{background:#980000;color:#fff;text-align:left;font-size:.6rem}
.ft .f-ev th.hol,.ft .f-h th.hol{background:#FFE27A;color:#000;text-align:center;max-width:34px;overflow:hidden;text-overflow:ellipsis}
.ft .f-h small{font-weight:500;opacity:.85}
.ft .g{background:#93C47D !important;color:#000 !important}
.ft td.s0,.ft th.s0{position:sticky;left:0;z-index:2}
.ft td.s1,.ft th.s1{position:sticky;left:28px;z-index:2;text-align:left}
.ft td.s2,.ft th.s2{position:sticky;left:98px;z-index:2;text-align:left;box-shadow:2px 0 0 #c9c9cc}
.ft tbody td.s0,.ft tbody td.s1,.ft tbody td.s2{background:#fff}
.ft tbody tr.me td.s2{font-weight:800;box-shadow:inset 3px 0 0 var(--accent),2px 0 0 #c9c9cc}
.ft tbody tr.me td{font-weight:700}
.ft .f-gap td{border-left:0;border-right:0;height:10px;background:#fff}
.ft .f-tot td{background:#FFFF00 !important}

.pubbar .stp{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.04em;padding:.2rem .55rem;border-radius:4px;margin-right:.35rem;vertical-align:1px}
.pubbar .stp.w{background:#FFB020;color:#000}.pubbar .stp.r{background:var(--need,#D7141A);color:#fff}.pubbar .stp.a{background:#4CAF50;color:#fff}.pubbar .stp.n{background:var(--chip);color:var(--ink)}

/* share slide switch */
.pubbar .sw{display:inline-flex;align-items:center;gap:.6rem;border:0;border-radius:999px;padding:.28rem .9rem .28rem .28rem;font:inherit;font-size:.7rem;font-weight:800;letter-spacing:.05em;color:#fff;cursor:pointer;transition:background .25s ease,box-shadow .25s ease;text-transform:uppercase}
.pubbar .sw .knob{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .25s ease;flex:none}
.pubbar .sw.off{background:#D7141A;cursor:not-allowed}
.pubbar .sw.on{background:#2E9E4F;flex-direction:row-reverse;padding:.28rem .28rem .28rem .9rem;box-shadow:0 4px 14px rgba(46,158,79,.35)}
.pubbar .sw.on:hover{background:#268a44}
.pubbar .sw:disabled{opacity:1}
.pubbar .sw.on:disabled{opacity:.6}

/* ===== Clock screen ===== */
.app.clockmode .monthbar,.app.clockmode #railNav,.app.clockmode #windowBar,.app.clockmode #cal,.app.clockmode .legend,.app.clockmode #needBar,
.app.clockmode #pubBar,.app.clockmode #rosterView,.app.clockmode #apprView,.app.clockmode aside{display:none !important}
.app.clockmode .layout{grid-template-columns:minmax(0,1fr) !important}
.clk{background:var(--surface);border-radius:18px;box-shadow:0 14px 34px rgba(20,20,22,.10);padding:1.6rem 1.4rem;text-align:center;max-width:560px;margin:0 auto 1.2rem}
.clk-who{font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.clk-time{font-size:3.6rem;font-weight:800;letter-spacing:.04em;line-height:1.1;margin:.3rem 0}
.clk-date{font-size:.78rem;color:var(--muted)}
.clk-shift{margin:.9rem 0 .4rem;font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif;text-transform:none}
.clk-warn{background:#FDECEC;color:#B00010;border-radius:10px;padding:.55rem .8rem;margin:.6rem 0;font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif;text-transform:none;font-weight:600;font-size:.9rem}
.clk-rec{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.9rem 0 .4rem}
.clk-rec>div{background:var(--chip);border-radius:12px;padding:.7rem}
.clk-rec small{display:block;font-size:.66rem;color:var(--muted);letter-spacing:.1em}
.clk-rec b{display:block;font-size:1.5rem}
.clk-rec em{display:block;font-style:normal;font-size:.72rem;color:#B00010;font-family:"IBM Plex Sans Thai",sans-serif;margin-top:.2rem}
.clk-reason{font-family:"IBM Plex Sans Thai",sans-serif;text-transform:none;font-size:.85rem;color:var(--muted)}
.clk-btn{display:block;width:100%;border:0;border-radius:16px;padding:1.15rem;font:inherit;font-weight:800;font-size:1.15rem;letter-spacing:.08em;color:#fff;margin-top:1rem;cursor:pointer;box-shadow:0 10px 24px rgba(20,20,22,.18)}
.clk-btn.in{background:#17171A}.clk-btn.out{background:#990000}
.clk-btn:disabled{opacity:.5}
.clk-hint{font-family:"IBM Plex Sans Thai",sans-serif;text-transform:none;font-size:.8rem;color:var(--muted);margin:.5rem 0 0}
.clk-done{margin-top:1rem;padding:1rem;border-radius:14px;background:#E9F5E1;color:#21401A;font-family:"IBM Plex Sans Thai",sans-serif;font-weight:700}
.cpill{display:inline-block;font-size:.62rem;font-weight:800;padding:.12rem .45rem;border-radius:4px;margin-top:.3rem;letter-spacing:.04em}
.cpill.ok{background:#4CAF50;color:#fff}.cpill.late{background:#D7141A;color:#fff}.cpill.na{background:#ECEDEF;color:#333}
.clk-card{background:var(--surface);border-radius:var(--radius-m);box-shadow:0 10px 26px rgba(20,20,22,.08);padding:1rem 1.1rem;margin-bottom:1rem}
.clk-card h3{margin:0 0 .6rem;font-size:.9rem;font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif}
.clk-tw{overflow-x:auto}
.clk-t{width:100%;border-collapse:collapse;font-size:.74rem}
.clk-t th,.clk-t td{border-bottom:1px solid var(--line);padding:.4rem .45rem;text-align:left;white-space:nowrap;vertical-align:top}
.clk-t th{font-size:.64rem;color:var(--muted);letter-spacing:.06em}
.clk-t a{text-decoration:none;font-size:1rem}
.clk-r{white-space:normal;font-family:"IBM Plex Sans Thai",sans-serif;text-transform:none;color:var(--muted);font-size:.72rem;max-width:200px}
.clk-empty{text-align:center !important;color:var(--muted)}
.clk-miss{font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif;text-transform:none;font-size:.8rem;margin:.7rem 0 0;color:#B00010}
.clk-modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.6);display:flex;align-items:center;justify-content:center;padding:1rem}
.clk-box{background:var(--surface);border-radius:18px;padding:1.1rem;width:min(420px,100%);max-height:92vh;overflow:auto;text-align:center}
.clk-box h3{margin:.2rem 0 .7rem}
.clk-box img.clk-shot{width:100%;max-height:50vh;object-fit:contain;border-radius:12px;background:#000}
.clk-cam{width:100%;max-height:56vh;object-fit:cover;border-radius:12px;background:#000;transform:scaleX(-1)}
.clk-geo{font-family:"IBM Plex Sans Thai",sans-serif;text-transform:none;font-size:.82rem;color:var(--muted);margin:.6rem 0}
.clk-box textarea{width:100%;font:inherit;font-family:"IBM Plex Sans Thai",sans-serif;text-transform:none;border:1px solid var(--line);border-radius:10px;padding:.55rem;resize:vertical;background:var(--surface);color:var(--ink)}
.clk-act{display:flex;gap:.6rem;margin-top:.9rem}.clk-act .btn{flex:1}

.spin{display:inline-block;width:1em;height:1em;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

.clk-ths{white-space:nowrap}
.clk-th{width:42px;height:52px;object-fit:cover;border-radius:6px;margin-right:4px;vertical-align:middle;border:1px solid var(--line)}
.clk-pl{display:inline-block;white-space:normal;min-width:160px;max-width:240px;font-family:"IBM Plex Sans Thai",sans-serif;text-transform:none;font-size:.74rem;line-height:1.35;color:var(--ink);text-decoration:none}

.clk-geo b.clk-in{color:#21401A}.clk-geo b.clk-out{color:#B00010}
.clk-geo small{opacity:.75}

/* FT / PT tags */
.ttag{display:inline-block;font-family:"Source Code Pro",monospace;font-size:.58rem;font-weight:800;letter-spacing:.05em;padding:.1rem .4rem;border-radius:4px;vertical-align:1px;white-space:nowrap}
.ttag.ft{background:#17171A;color:#fff}.ttag.pt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.3px currentColor}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ttag.ft{background:#F1F1F2;color:#141416}}
/* Employee contact */
.app.clockmode #contactsView{display:block}
.ct-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.ct-head h2{margin:0;font-size:1.3rem}
.ct-head p{margin:.25rem 0 0;color:var(--muted);font-size:.8rem}
.ct-head input{max-width:280px;flex:1 1 200px;padding:.6rem .8rem;border-radius:12px;text-transform:none;font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif}
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.ct-card{display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:1rem .7rem;border:0;border-radius:16px;background:var(--surface);color:var(--ink);box-shadow:0 10px 26px rgba(20,20,22,.08);cursor:pointer;font:inherit;text-align:center}
.ct-card:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(20,20,22,.14)}
.ct-card b{font-size:.95rem}
.ct-name{font-family:"IBM Plex Sans Thai",sans-serif;text-transform:none;font-size:.78rem;color:var(--muted);line-height:1.3}
.ct-card small{font-size:.66rem;color:var(--muted)}
.ct-av{width:76px;height:76px;border-radius:50%;object-fit:cover;margin-bottom:.3rem}
.ct-big{width:132px;height:132px;border-radius:50%;object-fit:cover;margin:.4rem auto .6rem;display:block}
.ini{display:grid;place-items:center;background:var(--chip);color:var(--ink);font-family:"Source Code Pro",monospace;font-weight:800;font-size:1.4rem}
.ct-big.ini{font-size:2.4rem;display:grid}
.ct-box{position:relative;text-align:center}
.ct-box h3{margin:.1rem 0 .4rem;font-size:1.3rem}
.ct-x{position:absolute;right:.7rem;top:.5rem;border:0;background:transparent;font-size:1.6rem;color:var(--muted);cursor:pointer}
.ct-pos{font-size:.75rem;color:var(--muted)}
.ct-rows{margin-top:1rem;text-align:left;border-top:1px solid var(--line)}
.ct-row{display:flex;justify-content:space-between;gap:1rem;padding:.6rem .2rem;border-bottom:1px solid var(--line);font-size:.85rem}
.ct-row span{color:var(--muted);font-size:.72rem;letter-spacing:.04em}
.ct-row b{font-family:"IBM Plex Sans Thai","Source Code Pro",sans-serif;text-transform:none;text-align:right;word-break:break-word}
.ct-row a{color:var(--ink)}

.side a.nav{text-decoration:none}
.side .nav .ext{margin-left:auto;font-style:normal;font-size:.85rem;opacity:.6}

/* ===== Solid black background (overrides the store photo) ===== */
html,body{background:#000 !important;background-color:#000 !important}
.login{background:#000 !important}
#monthTitle,.ct-head h2{color:#fff}
.ct-head p,.legend,.legend span,.pubnote{color:rgba(255,255,255,.72)}
#todayBtn{color:rgba(255,255,255,.8)}
.iconbtn{background:#1c1c1f;color:#fff;border-color:#2c2c30}
.rail-inner::before{opacity:.5}
/* side menu on black */
.side{background:#0b0b0c !important;border-right-color:#1d1d20 !important;box-shadow:none !important}
.side-title{color:rgba(255,255,255,.5)}
.side .nav{color:#e9e9ea}
.side .nav:hover{background:rgba(255,255,255,.08)}
.side .nav[aria-current="page"]{background:#fff !important;color:#000 !important;box-shadow:none}
@media (max-width:900px){.side{border-top-color:#1d1d20 !important}}
.tag{background:#1c1c1f !important;color:#e9e9ea !important;border-color:#2e2e33 !important}
.tag small{color:#9a9ca1 !important}
.tag[aria-pressed="true"]{background:#fff !important;color:#000 !important;border-color:#fff !important;box-shadow:0 0 0 2px #fff}
.tag[aria-pressed="true"] small{color:#555 !important}
</style>


</head>

  try{ const r = await api.call(fn, S.token, S.ym, x.src, x.branch, x.month, note); toast(r.msg); S.busy = false; applyData(r.data); }
  catch(e){ console.error(e); toast("Something went wrong. Tap Refresh and try again."); }
  finally{ S.busy = false; render(); }
}

/* =================== Clock in / Clock out =================== */
const mins = t => { const a = String(t).split(":").map(Number); return a[0]*60 + (a[1]||0); };
const clkPill = s => { s = String(s||""); const c = /^Late/.test(s) ? "late" : /^On time/.test(s) ? "ok" : "na"; return s ? '<span class="cpill '+c+'">'+esc(s)+'</span>' : ''; };
const mapLink = loc => { const m = String(loc||"").match(/(-?\d+\.\d+),(-?\d+\.\d+)/); return m ? '<a href="https://maps.google.com/?q='+m[1]+','+m[2]+'" target="_blank" rel="noopener">📍</a>' : ''; };
const photoLink = u => /^https?:/.test(u||"") ? '<a href="'+esc(u)+'" target="_blank" rel="noopener">📷</a>' : '';
const thumbCell = (t, u) => t ? (/^https?:/.test(u||"") ? '<a href="'+esc(u)+'" target="_blank" rel="noopener">' : '')+'<img class="clk-th" src="'+t+'" alt="Selfie">'+(/^https?:/.test(u||"") ? '</a>' : '') : photoLink(u);
const placeCell = (p, loc) => { const m = String(loc||"").match(/(-?\d+\.\d+),(-?\d+\.\d+)/), href = m ? 'https://maps.google.com/?q='+m[1]+','+m[2] : '';
  if (!p) return mapLink(loc) || '–'; return href ? '<a class="clk-pl" href="'+href+'" target="_blank" rel="noopener">📍 '+esc(p)+'</a>' : '<span class="clk-pl">'+esc(p)+'</span>'; };
function makeThumb(dataUrl){ return new Promise(res => { const img = new Image(); img.onload = () => {
  const s = Math.min(1, 240 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
  cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  res(cv.toDataURL("image/jpeg", 0.62)); }; img.onerror = () => res(""); img.src = dataUrl; }); }
async function clockRefresh(){
  if (S.clockLoading) return; S.clockLoading = true;
  try{ const r = await api.call("clockLoad", S.token);
    if (r && r.ok){ S.clock = r.data; if (S.data) render(); }
    else if (r && r.auth === false) showLogin("Please sign in again."); }
  catch(e){ console.error(e); }
  finally{ S.clockLoading = false; }
}
function renderClock(){
  const el = $("clockView"), c = S.clock;
  if (!c){ el.innerHTML = '<div class="emptysched"><b>กำลังโหลด…</b><span>Loading your clock</span></div>'; clockRefresh(); return; }
  const d = new Date(), t = pad(d.getHours())+":"+pad(d.getMinutes());
  const r = c.row, st = !r ? "none" : r.outAt ? "done" : "in";
  const lateNow = (st === "none" && c.shift && c.shift.start) ? Math.max(0, mins(t) - mins(c.shift.start) - c.grace) : 0;
  let h = '<div class="clk"><div class="clk-who">'+esc(c.name)+(c.pos ? ' · '+esc(c.pos) : '')+' '+typeTag(c.type, true)+'</div>'+
    '<div class="clk-time" id="clkTime">'+t+'</div><div class="clk-date">'+esc(clkLong(c.today))+' · '+esc(c.branch || "no branch")+'</div>'+
    '<div class="clk-shift">'+(c.shift && c.shift.label ? 'กะวันนี้ <b>'+esc(c.shift.label)+'</b>' : 'ไม่มีกะในตารางที่ประกาศ')+'</div>';
  if (lateNow > 0) h += '<div class="clk-warn">⚠ เลยเวลาเข้างานแล้ว '+lateNow+' นาที · ต้องใส่เหตุผลการมาสาย</div>';
  if (r) h += '<div class="clk-rec"><div><small>CLOCK IN</small><b>'+esc(r.inAt)+'</b>'+clkPill(r.status)+(r.late ? '<em>สาย '+esc(r.late)+' นาที</em>' : '')+'</div>'+
    '<div><small>CLOCK OUT</small><b>'+esc(r.outAt || "–")+'</b></div></div>'+(r.reason ? '<p class="clk-reason">เหตุผล: '+esc(r.reason)+'</p>' : '')+
    (r.inPlace ? '<p class="clk-reason">📍 เข้างาน: '+esc(r.inPlace)+'</p>' : '')+(r.outPlace ? '<p class="clk-reason">📍 ออกงาน: '+esc(r.outPlace)+'</p>' : '');
  if (st !== "done") h += '<button class="clk-btn '+(st === "none" ? "in" : "out")+'" id="clkBtn"'+(S.busy ? " disabled" : "")+'>📷 '+(st === "none" ? "CLOCK IN" : "CLOCK OUT")+'</button>'+
    '<p class="clk-hint">กดแล้วถ่ายเซลฟี่ ระบบบันทึกเวลาและตำแหน่งให้อัตโนมัติ</p>';
  else h += '<div class="clk-done">✓ ลงเวลาครบแล้ววันนี้</div>';
  h += '</div>';
  if (c.team){
    h += '<div class="clk-card"><h3>ลงเวลาวันนี้ · ทีม</h3><div class="clk-tw"><table class="clk-t"><thead><tr><th>Name</th><th>Branch</th><th>Shift</th><th>In</th><th>Status</th><th>Out</th><th>Selfie</th><th>Location</th><th>Dist.</th></tr></thead><tbody>'+
      (c.team.rows.length ? c.team.rows.map(x => '<tr><td><b>'+esc(x.name)+'</b> '+typeTag(x.type)+'</td><td>'+esc(x.branch)+'</td><td>'+esc(x.shift||"–")+'</td><td>'+esc(x.inAt)+'</td><td>'+clkPill(x.status)+(x.late ? ' '+esc(x.late)+'m' : '')+(x.reason ? '<div class="clk-r">'+esc(x.reason)+'</div>' : '')+'</td><td>'+esc(x.outAt||"–")+'</td><td class="clk-ths">'+thumbCell(x.inThumb, x.inPhoto)+thumbCell(x.outThumb, x.outPhoto)+'</td><td>'+placeCell(x.inPlace, x.inLoc)+'</td><td>'+(x.inDist ? esc(x.inDist)+' m' : '–')+'</td></tr>').join("") : '<tr><td colspan="9" class="clk-empty">ยังไม่มีใครลงเวลาวันนี้</td></tr>')+
      '</tbody></table></div>'+
      (c.team.missing.length ? '<p class="clk-miss"><b>มีกะวันนี้ แต่ยังไม่ลงเวลา:</b> '+c.team.missing.map(m => esc(m.name)+' '+typeTag(m.type)+' <small>('+esc(m.shift)+')</small>').join(", ")+'</p>' : '')+'</div>';
  }
  if (c.history && c.history.length){
    h += '<div class="clk-card"><h3>ประวัติการลงเวลาของฉัน</h3><div class="clk-tw"><table class="clk-t"><thead><tr><th>Date</th><th>Shift</th><th>In</th><th>Status</th><th>Out</th><th>Selfie</th></tr></thead><tbody>'+
      c.history.map(x => '<tr><td>'+esc(clkDM(x.date))+'</td><td>'+esc(x.shift||"–")+'</td><td>'+esc(x.inAt)+'</td><td>'+clkPill(x.status)+(x.late ? ' '+esc(x.late)+'m' : '')+'</td><td>'+esc(x.outAt||"–")+'</td><td class="clk-ths">'+thumbCell(x.inThumb, x.inPhoto)+thumbCell(x.outThumb, x.outPhoto)+'</td></tr>').join("")+'</tbody></table></div></div>';
  }
  el.innerHTML = h;
  const b = $("clkBtn");
  if (b) b.onclick = () => openCamera(st === "none" ? "in" : "out");
}
function clkDM(iso){ return new Intl.DateTimeFormat("en-GB",{weekday:"short", day:"numeric", month:"short"}).format(parseDate(iso)); }
function clkLong(iso){ return new Intl.DateTimeFormat("en-GB",{weekday:"long", day:"numeric", month:"long", year:"numeric"}).format(parseDate(iso)); }
setInterval(() => { const e = $("clkTime"); if (e){ const d = new Date(); e.textContent = pad(d.getHours())+":"+pad(d.getMinutes()); } }, 10000);

function shrinkPhoto(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 720 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL("image/jpeg", 0.72)); }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
const policyAllows = feat => { try { const p = document.permissionsPolicy || document.featurePolicy; return p && p.allowsFeature ? p.allowsFeature(feat) : null; } catch (e) { return null; } };
function getGeo(){
  const limit = new Promise(res => setTimeout(() => { if (!S.geoWhy) S.geoWhy = "หาตำแหน่งไม่ได้ (หน้าเว็บไม่ตอบกลับ)"; res(null); }, 6000));
  return Promise.race([getGeoRaw(), limit]);
}
function getGeoRaw(){
  return new Promise(res => {
    if (!navigator.geolocation) { S.geoWhy = "เบราว์เซอร์นี้ไม่รองรับการอ่านตำแหน่ง"; return res(null); }
    if (policyAllows("geolocation") === false) { S.geoWhy = "หน้าเว็บของ Google ไม่อนุญาตให้อ่านตำแหน่ง (ข้อจำกัดของระบบ ไม่ใช่มือถือ)"; return res(null); }
    navigator.geolocation.getCurrentPosition(p => { S.geoWhy = ""; res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); },
      err => { const m = String(err && err.message || "");
        S.geoWhy = /policy/i.test(m) ? "หน้าเว็บของ Google ไม่อนุญาตให้อ่านตำแหน่ง (ข้อจำกัดของระบบ ไม่ใช่มือถือ)" :
          err && err.code === 1 ? "ยังไม่ได้อนุญาตตำแหน่ง · เปิดการตั้งค่าเบราว์เซอร์ > ตำแหน่ง > อนุญาต" :
          err && err.code === 3 ? "หาตำแหน่งไม่ทัน · ลองใกล้หน้าต่างหรือเปิด GPS" : "หาตำแหน่งไม่ได้ (" + m + ")";
        res(null); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  });
}
/* Live camera first; phone camera button only as a fallback (photos older than 3 minutes are refused). */
const CLOCK_MAX_PHOTO_AGE_MIN = 3;
function stampPhoto(dataUrl){
  return new Promise(res => { const img = new Image(); img.onload = () => {
    const cv = document.createElement("canvas"); cv.width = img.width; cv.height = img.height; const g = cv.getContext("2d");
    g.drawImage(img, 0, 0); const d = new Date(), c = S.clock || {};
    const txt = (c.name || "") + " · " + new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric"}).format(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    const fs = Math.max(16, Math.round(cv.width / 26)); g.font = "700 " + fs + "px sans-serif";
    g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, cv.height - fs * 1.9, cv.width, fs * 1.9);
    g.fillStyle = "#fff"; g.fillText(txt, fs * .6, cv.height - fs * .6);
    res(cv.toDataURL("image/jpeg", 0.72)); }; img.src = dataUrl; });
}
async function openCamera(kind){
  S.clockKind = kind;
  S.geoWhy = ""; S.geoP = getGeo();                       // look for the location while the selfie is taken
  // Not allowed here → open the phone camera right away, inside this same tap
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || policyAllows("camera") === false) return fallbackCamera();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: false }); }
  catch (err) { console.warn("Live camera unavailable:", err && err.name); return cameraButton(kind); }
  const m = document.createElement("div"); m.className = "clk-modal"; m.id = "camModal";
  m.innerHTML = '<div class="clk-box"><h3>'+(kind === "in" ? "Clock in" : "Clock out")+' · ถ่ายเซลฟี่</h3>'+
    '<video id="camV" autoplay playsinline muted class="clk-cam"></video>'+
    '<div class="clk-act"><button class="btn" id="camX">ยกเลิก</button><button class="btn primary" id="camShot">📷 ถ่ายรูป</button></div></div>';
  document.body.appendChild(m);
  const v = $("camV"); v.srcObject = stream;
  const stop = () => { stream.getTracks().forEach(t => t.stop()); m.remove(); };
  $("camX").onclick = stop;
  $("camShot").onclick = async () => {
    if (!v.videoWidth){ toast("กล้องยังไม่พร้อม ลองอีกครั้ง"); return; }
    const sc = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight)), cv = document.createElement("canvas");
    cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
    const g = cv.getContext("2d"); g.translate(cv.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0, cv.width, cv.height);
    const shot = cv.toDataURL("image/jpeg", 0.8); stop();
    showClockConfirm(await stampPhoto(shot), kind, true);
  };
}
function fallbackCamera(){ const i = $("selfieInput"); i.value = ""; i.click(); }
/* After a failed live camera the original tap is used up, so ask for one more tap to open the phone camera. */
function cameraButton(kind){
  const m = document.createElement("div"); m.className = "clk-modal";
  m.innerHTML = '<div class="clk-box"><h3>ถ่ายเซลฟี่</h3><p class="clk-geo">หน้าเว็บนี้เปิดกล้องสดไม่ได้ จะใช้กล้องของมือถือแทน (รับเฉพาะรูปที่ถ่ายตอนนี้)</p>'+
    '<div class="clk-act"><button class="btn" id="cbX">ยกเลิก</button><button class="btn primary" id="cbGo">📷 เปิดกล้อง</button></div></div>';
  document.body.appendChild(m);
  m.querySelector("#cbX").onclick = () => m.remove();
  m.querySelector("#cbGo").onclick = () => { m.remove(); S.clockKind = kind; fallbackCamera(); };
}
$("selfieInput").onchange = async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  if (file.lastModified && Date.now() - file.lastModified > CLOCK_MAX_PHOTO_AGE_MIN * 60000){
    toast("ใช้รูปเก่าไม่ได้ กรุณาถ่ายเซลฟี่ใหม่ตอนนี้"); return; }
  let photo; try { photo = await stampPhoto(await shrinkPhoto(file)); } catch(err){ toast("Could not read the photo. Try again."); return; }
  showClockConfirm(photo, S.clockKind || "in", false);
};
function showClockConfirm(photo, kind, live){
  const c = S.clock || {};
  const d = new Date(), t = pad(d.getHours())+":"+pad(d.getMinutes());
  const late = (kind === "in" && c.shift && c.shift.start) ? Math.max(0, mins(t) - mins(c.shift.start) - (c.grace||0)) : 0;
  const m = document.createElement("div"); m.className = "clk-modal"; m.id = "clkModal";
  m.innerHTML = '<div class="clk-box"><h3>'+(kind === "in" ? "Clock in" : "Clock out")+' · '+t+'</h3><img src="'+photo+'" alt="Selfie" class="clk-shot">'+
    '<p class="clk-geo" id="clkGeo">📍 กำลังหาตำแหน่ง…</p>'+
    '<div id="clkLate"'+(late ? '' : ' class="hidden"')+'><p class="clk-warn">⚠ สาย <b id="clkLateMin">'+late+'</b> นาที · กรุณาใส่เหตุผล</p><textarea id="clkReason" rows="3" maxlength="300" placeholder="เหตุผลที่มาสาย เช่น รถติดหนัก / ไปหาหมอ"></textarea></div>'+
    '<div class="clk-act"><button class="btn" id="clkCancel">ถ่ายใหม่</button><button class="btn primary" id="clkOk">ยืนยัน</button></div></div>';
  document.body.appendChild(m);
  let geo = null, geoDone = false;
  (S.geoP || (S.geoP = getGeo())).then(async g => { geo = g; geoDone = true; const el = $("clkGeo"); if (!el) return;
    if (!g){ el.textContent = "📍 ไม่พบตำแหน่ง · " + (S.geoWhy || "ลองใหม่อีกครั้ง"); return; }
    el.textContent = "📍 พบตำแหน่ง (±"+Math.round(g.acc)+" m) · กำลังหาชื่อสถานที่…";
    try { const w = await api.call("clockWhere", S.token, g.lat, g.lng);
      const e2 = $("clkGeo"); if (!e2) return;
      if (w && w.ok && (w.where || w.place)){
        e2.innerHTML = (w.where ? '<b class="'+(w.inside === false ? "clk-out" : "clk-in")+'">'+esc(w.where)+'</b><br>' : '')+'📍 '+esc(w.place || "")+' <small>(±'+Math.round(g.acc)+' m)</small>';
      } else e2.textContent = "📍 พบตำแหน่ง (±"+Math.round(g.acc)+" m)";
    } catch (err) { const e2 = $("clkGeo"); if (e2) e2.textContent = "📍 พบตำแหน่ง (±"+Math.round(g.acc)+" m)"; } });
  $("clkCancel").onclick = () => { m.remove(); openCamera(kind); };
  $("clkOk").onclick = async () => {
    const okBtn = $("clkOk");
    if (okBtn.disabled) return;                               // ignore double taps
    const reason = ($("clkReason") || {}).value || "";
    if (!$("clkLate").classList.contains("hidden") && !reason.trim()){ toast("กรุณาใส่เหตุผลการมาสาย"); $("clkReason").focus(); return; }
    okBtn.disabled = true; $("clkCancel").disabled = true; okBtn.innerHTML = '<span class="spin"></span> กำลังบันทึก…';
    if (!geoDone){ const g = await Promise.race([S.geoP, new Promise(r => setTimeout(() => r(null), 1500))]); if (g){ geo = g; geoDone = true; } }
    try{
      const th = await makeThumb(photo);
      const r = await api.call("clockAction", S.token, kind, photo.split(",")[1], geo ? geo.lat : "", geo ? geo.lng : "", geo ? geo.acc : "", reason, th);
      if (r && r.needReason){ $("clkLate").classList.remove("hidden"); $("clkLateMin").textContent = r.late; toast(r.msg); okBtn.disabled = false; $("clkCancel").disabled = false; okBtn.textContent = "ยืนยัน"; return; }
      toast(r.msg || "Saved."); if (r.data) S.clock = r.data; S.geoP = null; m.remove(); render();
    }catch(err){ console.error(err); toast("Could not save. Check the internet and try again."); okBtn.disabled = false; $("clkCancel").disabled = false; okBtn.textContent = "ยืนยัน"; }
  };
}


/* =================== FT / PT tag + Employee contact =================== */
const typeTag = (t, long) => /full/i.test(t||"") ? '<span class="ttag ft" title="Full Time">'+(long ? "FULL TIME" : "FT")+'</span>' :
  /part/i.test(t||"") ? '<span class="ttag pt" title="Part Time">'+(long ? "PART TIME" : "PT")+'</span>' : '';
const initials = s => String(s||"?").replace(/[^A-Za-z0-9ก-๙ ]/g,"").trim().slice(0,2).toUpperCase() || "?";
const avatar = (x, cls) => x.photo ? '<img class="'+cls+'" src="'+x.photo+'" alt="'+esc(x.nick)+'">' : '<div class="'+cls+' ini">'+esc(initials(x.nick))+'</div>';
async function contactsRefresh(){
  if (S.ctLoading) return; S.ctLoading = true;
  try { const r = await api.call("contactsLoad", S.token);
    if (r && r.ok){ S.contacts = r.data; if (S.data) render(); }
    else if (r && r.auth === false) showLogin("Please sign in again."); }
  catch (e) { console.error(e); S.contacts = { list: [], error: true }; if (S.data) render(); }
  finally { S.ctLoading = false; }
}
function renderContacts(){
  const el = $("contactsView"), c = S.contacts;
  if (!c){ el.innerHTML = '<div class="emptysched"><b>กำลังโหลด…</b><span>Loading contacts</span></div>'; contactsRefresh(); return; }
  const q = (S.ctQ || "").toLowerCase();
  const list = c.list.filter(x => !q || [x.code, x.nick, x.name, x.email, x.phone, x.pos, x.branch, x.type].join(" ").toLowerCase().includes(q));
  const ft = c.list.filter(x => /full/i.test(x.type)).length, pt = c.list.filter(x => /part/i.test(x.type)).length;
  let h = '<div class="ct-head"><div><h2>พนักงาน</h2><p>'+c.list.length+' คน · '+typeTag("Full Time")+' '+ft+' · '+typeTag("Part Time")+' '+pt+'</p></div>'+
    '<input id="ctQ" placeholder="ค้นหา ชื่อ / รหัส / เบอร์ / อีเมล" value="'+esc(S.ctQ || "")+'" autocomplete="off"></div>';
  h += list.length ? '<div class="ct-grid">'+list.map(x => '<button class="ct-card" type="button" data-ct="'+c.list.indexOf(x)+'">'+avatar(x, "ct-av")+
      '<b>'+esc(x.nick)+'</b><span class="ct-name">'+esc(x.name || "–")+'</span>'+typeTag(x.type, true)+(x.pos ? '<small>'+esc(x.pos)+'</small>' : '')+'</button>').join("")+'</div>'
    : '<div class="emptysched"><b>ไม่พบรายชื่อ</b><span>'+(c.error ? "โหลดข้อมูลไม่สำเร็จ ลอง Refresh" : c.list.length ? "ลองค้นหาคำอื่น" : "ยังไม่มีข้อมูลพนักงานในแท็บ Contacts")+'</span></div>';
  el.innerHTML = h;
  const qi = $("ctQ");
  qi.oninput = () => { S.ctQ = qi.value; const p = qi.selectionStart; renderContacts(); const n = $("ctQ"); n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} };
  el.querySelectorAll("[data-ct]").forEach(b => b.onclick = () => showContact(c.list[+b.dataset.ct]));
}
function showContact(x){
  const m = document.createElement("div"); m.className = "clk-modal";
  const row = (k, v) => v ? '<div class="ct-row"><span>'+k+'</span><b>'+v+'</b></div>' : '';
  m.innerHTML = '<div class="clk-box ct-box"><button class="ct-x" aria-label="Close">×</button>'+avatar(x, "ct-big")+
    '<h3>'+esc(x.nick)+'</h3>'+typeTag(x.type, true)+(x.pos ? ' <span class="ct-pos">'+esc(x.pos)+'</span>' : '')+
    '<div class="ct-rows">'+row("Employee code", esc(x.code))+row("Nick name", esc(x.nick))+row("Full name", esc(x.name))+
    row("Phone", x.phone ? '<a href="tel:'+esc(String(x.phone).replace(/[^\d+]/g,""))+'">'+esc(x.phone)+'</a>' : "")+
    row("Email", x.email ? '<a href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a>' : "")+row("Branch", esc(x.branch))+'</div></div>';
  document.body.appendChild(m);
  const close = () => m.remove();
  m.querySelector(".ct-x").onclick = close; m.onclick = e => { if (e.target === m) close(); };
}

async function approvalAct(fn, note){
  const b = branch(); if (!b || S.busy) return;
  S.busy = true; renderPublish();
  try{
    const r = await api.call(fn, S.token, S.ym, b.id, note || "");
    toast(r.msg); S.busy = false; if (fn === "approveRoster" && r.ok){ S.preview = false; S.autoView = false; } applyData(r.data);
  }catch(e){ console.error(e); toast("Something went wrong. Tap Refresh and try again."); }
  finally{ S.busy = false; render(); }
}
async function publish(on){
  const b = branch(); if (!b || S.busy) return;
  S.busy = true; renderPublish();
  try{
    const r = await api.call(on ? "publishRoster" : "unpublishRoster", S.token, S.ym, b.id);
    toast(r.msg); S.busy = false; if (on && r.ok) S.viewKey = null; applyData(r.data);
  }catch(e){ console.error(e); toast("Something went wrong. Tap Refresh and try again."); }
  finally{ S.busy = false; render(); }
}
function render(){ if (!S.data) return; renderHeader(); renderRail(); renderPublish(); renderNeeds(); if (S.view === "schedule" || S.view === "approvals" || S.view === "clock") $("needBar").classList.add("hidden"); renderWindow(); if (S.view === "schedule" || S.view === "approvals") $("windowBar").classList.add("hidden"); renderCal(); renderSide(); if (S.sheetMode) drawDay(); }

/* ---------- day sheet ---------- */
function openDay(date){
  if (!branch()) return; S.openDate = date; S.sheetMode = true; drawDay();
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  setTimeout(()=>{ const f=$("sheet").querySelector("button.primary, button"); if(f) f.focus(); },60);
}
function closeSheet(){ S.sheetMode=false; S.openDate=null; $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); }
$("scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key==="Escape" && S.sheetMode) closeSheet(); });
function drawDay(){
  const b = branch(), date = S.openDate, s = $("sheet"); if (!b || !date) return;
  const past = date < today(), list = bookedOn(date), mine = myName(), mgr = isMgr();
  const booked = {}; list.forEach(v => booked[v.staff] = true);
  const iAmIn = !!booked[mine];
  const w = windowFor(date.slice(0,7)), canChange = isOpenMonth(date.slice(0,7)), need = needOn(date);
  let h = '<div class="sheet-head"><div><h2 id="sheetTitle">'+esc(fmtLong.format(parseDate(date)))+'</h2><p>'+esc(b.name)+' · '+list.length+' booked</p></div><button class="iconbtn" data-close aria-label="Close">✕</button></div>';
  const hint = past ? (mgr ? "This day has passed. As manager you can still remove a booking." : "This day has passed.")
    : mgr ? "Manager view: you can remove a booking."
    : need ? (iAmIn ? "You're booked for this day. Thank you!" : "The store needs more people on this day. Tap “Book” to help.")
    : !canChange ? (today() < w.open ? "Not open yet. Sign-up opens on "+fmtDM.format(parseDate(w.open))+"." : "Locked. Sign-up closed on "+fmtDM.format(parseDate(w.close))+".")
    : iAmIn ? "You're booked for this day." : "Tap “Book” to take this day.";
  if (holOn(date)) h += '<div class="holbox"><b>COMPANY HOLIDAY</b> · '+esc(holOn(date))+'</div>';
  if (need && !past) h += '<div class="needbox"><b>HELP NEEDED</b>'+(need.note ? ' · '+esc(need.note) : '')+'</div>';
  if (mgr && !past) h += need
    ? '<div class="needctl"><button class="btn" data-unneed'+(S.busy?" disabled":"")+'>Clear help-needed mark</button></div>'
    : '<div class="needctl"><input id="needNote" maxlength="80" placeholder="Note (optional)" aria-label="Note for PCs"><button class="btn primary" data-need'+(S.busy?" disabled":"")+'>Mark: help needed</button></div>';
  h += '<p class="empty" style="margin-bottom:.6rem">'+hint+'</p><div class="roster">';
  const names = [...b.staff]; list.forEach(v => { if (v.staff && !names.includes(v.staff)) names.push(v.staff); });
  const others = list.filter(v => !v.staff).length;
  names.sort((x,y) => (x===mine?-1:y===mine?1:0));
  for (const nm of names){
    let act = "";
    if (mgr && booked[nm]) act = '<button class="btn danger" data-cancel="'+esc(nm)+'"'+(S.busy?" disabled":"")+'>Remove</button>';
    else if (!past && nm === mine && !mgr){
      if (booked[nm] && canChange) act = '<button class="btn danger" data-cancel="'+esc(nm)+'"'+(S.busy?" disabled":"")+'>Cancel</button>';
      else if (!booked[nm] && (canChange || need)) act = '<button class="btn primary" data-book'+(S.busy?" disabled":"")+'>'+(S.busy?"Booking…":"Book")+'</button>';
    }
    h += '<div class="person'+(booked[nm]?" booked":"")+'"><span class="n">'+esc(nm)+(nm===mine?' <span class="s">(you)</span>':"")+(booked[nm]?' <span class="s">booked</span>':"")+'</span>'+act+'</div>';
  }
  if (others > 0) h += '<div class="person others"><span class="n">'+others+' other '+(others===1?"person":"people")+' booked this day</span></div>';
  s.innerHTML = h + '</div>';
  s.querySelectorAll("[data-close]").forEach(el => el.onclick = closeSheet);
  s.querySelectorAll("[data-book]").forEach(el => el.onclick = () => act("book", date));
  s.querySelectorAll("[data-cancel]").forEach(el => el.onclick = () => act("cancel", date, el.dataset.cancel));
  s.querySelectorAll("[data-need]").forEach(el => el.onclick = () => markNeed(date, true, ($("needNote")||{}).value));
  s.querySelectorAll("[data-unneed]").forEach(el => el.onclick = () => markNeed(date, false, ""));
}
async function markNeed(date, on, note){
  const b = branch(); if (!b || S.busy) return;
  S.busy = true; drawDay();
  try{
    const r = await api.call("setNeed", S.token, S.ym, date, b.id, note || "", on);
    toast(r.msg); S.busy = false; applyData(r.data);
  }catch(e){ console.error(e); toast("Something went wrong. Tap Refresh and try again."); }
  finally{ S.busy = false; render(); }
}
async function act(fn, date, name){
  const b = branch(); if (!b || S.busy) return;
  S.busy = true; drawDay();
  try{
    const r = fn === "book" ? await api.call("book", S.token, S.ym, date) : await api.call("cancel", S.token, S.ym, date, b.id, name);
    toast(r.ok && fn === "book" ? "Booked for "+fmtLong.format(parseDate(date)) : r.msg);
    S.busy = false; applyData(r.data);
  }catch(e){ console.error(e); toast("Something went wrong. Tap Refresh and try again."); }
  finally{ S.busy = false; render(); }
}

function shiftMonth(delta){ const [y,m]=S.ym.split("-").map(Number); const d=new Date(y,m-1+delta,1); S.ym=d.getFullYear()+"-"+pad(d.getMonth()+1); S.autoView = true; S.navFlag = true; render(); refresh(true); }
$("prevBtn").onclick = () => shiftMonth(-1);
$("nextBtn").onclick = () => shiftMonth(1);
$("todayBtn").onclick = () => { const t=new Date(); S.ym=t.getFullYear()+"-"+pad(t.getMonth()+1); S.autoView = true; S.navFlag = true; render(); refresh(true); };

/* approval link: ?review=<branch>&month=<yyyy-mm> opens that roster for review */
function useDeepLink(p){
  if (!p || !p.review) return;
  if (p.remote){ S.deepAp = { branch: String(p.review), month: String(p.month || "") }; if (S.token) refresh(); return; }
  S.deep = { branch: String(p.review), month: /^\d{4}-\d{2}$/.test(p.month || "") ? p.month : S.ym };
  S.ym = S.deep.month; S.branchId = S.deep.branch; S.jumped = true;
  if (S.token) refresh();
}
if (IN_GOOGLE && google.script.url && google.script.url.getLocation) google.script.url.getLocation(loc => useDeepLink(loc && loc.parameter));
else if (REMOTE) useDeepLink(Object.fromEntries(new URLSearchParams(location.search)));
if (S.token) refresh(); else showLogin();
})();
</script>
